name: CIRCUIT ZERO · Android APK 0.7
on:
  push:
    branches:
      - circuit-zero-android-beta-v07
    paths-ignore:
      - build_status/CIRCUIT_ZERO_V07.txt
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: circuit-zero-beta-v07
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract CIRCUIT ZERO 0.7 Dart source
        run: |
          base64 --decode circuit_zero_v07_src.b64 | tar -xJf -
          test -f lib/main.dart
          test -f test/game_engine_test.dart
      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android --project-name circuit_zero --org com.circuitzero .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos lib test/game_engine_test.dart
      - name: Test gameplay
        run: flutter test test/game_engine_test.dart
      - name: Build Android APK release
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CIRCUIT_ZERO_Origin_Beta_07_Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Record result and run URL
        if: always()
        run: |
          mkdir -p build_status
          {
            echo "result=${{ job.status }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
          } > build_status/CIRCUIT_ZERO_V07.txt
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add build_status/CIRCUIT_ZERO_V07.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci(circuit-zero): record Android 0.7 build result [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
