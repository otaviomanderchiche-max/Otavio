name: CIRCUIT ZERO · Android APK 0.7
on:
  push:
    branches:
      - circuit-zero-android-beta-v07
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract CIRCUIT ZERO 0.7 Dart source
        run: |
          base64 --decode circuit_zero_v07_src.b64 | tar -xJf -
          test -f lib/main.dart
          test -f test/game_engine_test.dart
      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android --project-name circuit_zero --org com.circuitzero .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos lib test/game_engine_test.dart
      - name: Test gameplay
        run: flutter test test/game_engine_test.dart
      - name: Build Android APK release
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CIRCUIT_ZERO_Origin_Beta_07_Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
