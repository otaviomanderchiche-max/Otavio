name: CIRCUIT ZERO · Android APK
on:
  push:
    branches:
      - circuit-zero-android-beta-v06
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extrair código-fonte Flutter
        run: |
          tar -xJf circuit_zero_src.tar.xz
          test -f lib/main.dart
          test -f pubspec.yaml
      - name: Gerar arquivos de plataforma Android
        run: flutter create --platforms=android --project-name circuit_zero --org com.circuitzero .
      - name: Instalar dependências
        run: flutter pub get
      - name: Verificar código
        run: flutter analyze
      - name: Executar testes
        run: flutter test
      - name: Compilar APK release
        run: flutter build apk --release
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CIRCUIT_ZERO_Origin_Beta_06_Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
