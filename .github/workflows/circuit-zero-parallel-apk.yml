name: CIRCUIT ZERO · Android 0.7 (instala em paralelo)
on:
  push:
    branches: [circuit-zero-android-v07-parallel]
    paths-ignore:
      - build_status/CIRCUIT_ZERO_V07_PARALLEL.txt
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: circuit-zero-beta-v07-parallel
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Announce run for monitoring
        run: |
          mkdir -p build_status
          {
            echo "result=running"
            echo "run_id=${{ github.run_id }}"
            echo "run_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > build_status/CIRCUIT_ZERO_V07_PARALLEL.txt
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add build_status/CIRCUIT_ZERO_V07_PARALLEL.txt
          git commit -m "ci(circuit-zero): announce parallel Android build [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract Flutter 0.7 code
        run: base64 --decode circuit_zero_v07_src.b64 | tar -xJf -
      - name: Generate separate Android app
        run: |
          flutter create --platforms=android --project-name circuit_zero --org com.circuitzero.beta07 .
          sed -i 's/android:label="circuit_zero"/android:label="CIRCUIT ZERO 0.7"/' android/app/src/main/AndroidManifest.xml
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos lib test/game_engine_test.dart
      - name: Test gameplay
        run: flutter test test/game_engine_test.dart
      - name: Build Android APK
        run: flutter build apk --release
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: CIRCUIT_ZERO_Origin_Beta_07_Android_Paralelo
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Record result
        if: always()
        run: |
          mkdir -p build_status
          {
            echo "result=${{ job.status }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > build_status/CIRCUIT_ZERO_V07_PARALLEL.txt
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add build_status/CIRCUIT_ZERO_V07_PARALLEL.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci(circuit-zero): record parallel APK result [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
